# Build the site with Jekyll and deploy it to GitHub Pages.
#
# The custom plugins in _plugins/ are the core of this template, so the build
# uses `bundle exec jekyll build` instead of the GitHub Pages builder (which
# runs Jekyll in safe mode and would ignore _plugins/).
#
# Pages must be enabled for the repository once:
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# See the "Deployment" section in README.md.
name: Build and deploy Jekyll site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fails with a "Get Pages site failed" error when Pages is not enabled
      # or its source is not "GitHub Actions". Enable it once in the
      # repository settings before running the workflow.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install dependencies
        run: bundle install

      # --baseurl uses the Pages base path: "" for <user>.github.io and
      # "/<repo>" for project pages, so links work in both cases.
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
